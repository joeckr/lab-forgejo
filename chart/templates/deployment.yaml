apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.forgejo.name }}
  labels:
    {{- include "lab-forgejo.labels" . | nindent 4 }}
    {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 4 }}
spec:
  replicas: {{ .Values.forgejo.replicaCount }}
  # Recreate is required for ReadWriteOnce Longhorn PVCs to avoid Multi-Attach deadlocks
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "lab-forgejo.labels" . | nindent 8 }}
        {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 8 }}
      annotations:
        checksum/init-config: {{ include (print $.Template.BasePath "/forgejo-configmap.yaml") . | sha256sum }}
    spec:
      {{- with .Values.forgejo.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.forgejo.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      automountServiceAccountToken: false
      volumes:
        - name: forgejo-data
          persistentVolumeClaim:
            claimName: {{ .Values.forgejo.name }}-data
        - name: forgejo-init
          configMap:
            name: {{ .Values.forgejo.name }}-init
            defaultMode: 0555
      initContainers:
        - name: wait-for-postgres
          image: "{{ .Values.postgres.image }}:{{ .Values.postgres.tag }}"
          imagePullPolicy: {{ .Values.postgres.pullPolicy }}
          {{- with .Values.forgejo.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - -c
            - |
              until pg_isready -h "${DB_HOST}" -p "${DB_PORT}" -U "${DB_USER}"; do
                echo "Waiting for PostgreSQL at ${DB_HOST}:${DB_PORT}..."
                sleep 2
              done
          env:
            - name: DB_HOST
              value: {{ include "lab-forgejo.dbHostOnly" . | quote }}
            - name: DB_PORT
              value: {{ include "lab-forgejo.dbPort" . | quote }}
            - name: DB_USER
              value: {{ include "lab-forgejo.dbUser" . | quote }}
        - name: configure-forgejo
          image: "{{ .Values.forgejo.image }}:{{ .Values.forgejo.tag }}"
          imagePullPolicy: {{ .Values.forgejo.pullPolicy }}
          {{- with .Values.forgejo.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - /bin/sh
            - /scripts/init-forgejo.sh
          env:
            {{- include "lab-forgejo.forgejo.env" . | nindent 12 }}
            {{- if .Values.oidc.enabled }}
            - name: OIDC_NAME
              value: {{ .Values.oidc.name | quote }}
            - name: OIDC_AUTO_DISCOVER_URL
              value: {{ .Values.oidc.autoDiscoverUrl | quote }}
            - name: OIDC_SCOPES
              value: {{ .Values.oidc.scopes | quote }}
            - name: OIDC_GROUP_CLAIM_NAME
              value: {{ .Values.oidc.groupClaimName | quote }}
            - name: OIDC_ADMIN_GROUP
              value: {{ .Values.oidc.adminGroup | quote }}
            - name: OIDC_RESTRICTED_GROUP
              value: {{ .Values.oidc.restrictedGroup | quote }}
            - name: OIDC_SKIP_LOCAL_2FA
              value: {{ .Values.oidc.skipLocal2fa | quote }}
            - name: OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: {{ .Values.secretKeys.oidcClientId | quote }}
                  optional: {{ empty .Values.oidc.autoDiscoverUrl }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret | quote }}
                  key: {{ .Values.secretKeys.oidcClientSecret | quote }}
                  optional: {{ empty .Values.oidc.autoDiscoverUrl }}
            {{- end }}
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
              subPath: data
            - name: forgejo-data
              mountPath: /etc/gitea
              subPath: config
            - name: forgejo-init
              mountPath: /scripts
              readOnly: true
      containers:
        - name: {{ .Values.forgejo.name }}
          image: "{{ .Values.forgejo.image }}:{{ .Values.forgejo.tag }}"
          imagePullPolicy: {{ .Values.forgejo.pullPolicy }}
          {{- with .Values.forgejo.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - containerPort: {{ .Values.forgejo.httpPort }}
              name: http
              protocol: TCP
            {{- if .Values.forgejo.ssh.enabled }}
            - containerPort: {{ .Values.forgejo.ssh.port }}
              name: ssh
              protocol: TCP
            {{- end }}
          env:
            {{- include "lab-forgejo.forgejo.env" . | nindent 12 }}
          volumeMounts:
            - name: forgejo-data
              mountPath: /var/lib/gitea
              subPath: data
            - name: forgejo-data
              mountPath: /etc/gitea
              subPath: config
          startupProbe:
            httpGet:
              path: /api/healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          {{- with .Values.forgejo.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
