{{- if .Values.postgres.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.postgres.name }}
  labels:
    {{- include "lab-forgejo.labels" . | nindent 4 }}
    {{- include "lab-forgejo.postgres.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.postgres.port }}
      targetPort: postgres
      protocol: TCP
      name: postgres
  selector:
    {{- include "lab-forgejo.postgres.selectorLabels" . | nindent 4 }}
{{- end }}
