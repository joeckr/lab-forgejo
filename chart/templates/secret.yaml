{{- if .Values.secretCreate }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret | quote }}
  labels:
    {{- include "lab-forgejo.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $val := .Values.secretData }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
{{- end }}
