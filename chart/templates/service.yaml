apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.forgejo.name }}
  labels:
    {{- include "lab-forgejo.labels" . | nindent 4 }}
    {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.forgejo.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 4 }}
{{- if .Values.forgejo.ssh.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.forgejo.name }}-ssh
  labels:
    {{- include "lab-forgejo.labels" . | nindent 4 }}
    {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 4 }}
spec:
  type: {{ .Values.forgejo.ssh.serviceType }}
  ports:
    - port: {{ .Values.forgejo.ssh.servicePort }}
      targetPort: ssh
      protocol: TCP
      name: ssh
  selector:
    {{- include "lab-forgejo.forgejo.selectorLabels" . | nindent 4 }}
{{- end }}
